apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doi.fullname" . }}
  labels:
    {{- include "doi.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "doi.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "doi.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: config-init
          image: "{{ .Values.configInit.image.repository }}:{{ .Values.configInit.image.tag }}"
          imagePullPolicy: {{ .Values.configInit.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              for file in /config-template/*; do
                base="$(basename "$file")"
                if [ "$base" != "doi.properties" ]; then
                  cp "$file" "/config/$base"
                fi
              done
              PASSWORD="$(tr -d '\n' < /secrets/datacite-password/password)"
              awk -v password="$PASSWORD" '{
                if (index($0, "__DATACITE_PASSWORD__")) {
                  gsub("__DATACITE_PASSWORD__", password)
                }
                print
              }' /config-template/doi.properties > /config/doi.properties
              cp /certs/doiadmin.pem /config/doiadmin.pem
              cp /certs/cadcproxy.pem /config/cadcproxy.pem
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
            - name: datacite-password
              mountPath: /secrets/datacite-password
              readOnly: true
            - name: doi-admin-cert
              mountPath: /certs/doiadmin.pem
              subPath: doiadmin.pem
              readOnly: true
            - name: servops-cert
              mountPath: /certs/cadcproxy.pem
              subPath: cadcproxy.pem
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
{{ with .Values.volumeMounts }}
{{ toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "doi.fullname" . }}-config
        - name: config
          emptyDir: {}
        - name: datacite-password
          secret:
            secretName: {{ required "app.datacite.passwordSecret.name is required" .Values.app.datacite.passwordSecret.name }}
            items:
              - key: {{ required "app.datacite.passwordSecret.key is required" .Values.app.datacite.passwordSecret.key }}
                path: password
        - name: doi-admin-cert
          secret:
            secretName: {{ include "doi.doiAdminSecretName" . }}
        - name: servops-cert
          secret:
            secretName: {{ include "doi.servopsSecretName" . }}
{{ with .Values.volumes }}
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
